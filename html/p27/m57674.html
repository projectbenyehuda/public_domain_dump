	<title>הַהַצְלָחָה וְהָאָסוֹן</title>
	<meta name="author" content="אברהם בר גוטלובר"/>
</head>
<body>

<p><a href="#fn:1" id="fnref:1" title="see footnote" class="footnote"><sup>1</sup></a></p>

<blockquote>
<p>בַּעֲצַלְתַּיִם תָּבוֹא הַהַצְלָחָה אֱלֵי גָבֶר,</p>

<p>וְהָאָסוֹן – עַל כַּנְפֵי נְשָׁרִים יִשָּׂא הַשּׁוֹד וְהַשֶּׁבֶר.</p>
</blockquote>

<div class="footnotes">
<hr />

<li id="fn:1">
<p>מלשון רוסיא משירי חאראמקאָוו. <a href="#fnref:1" title="return to body" class="reversefootnote">&#160;&#8617;</a></p>
</li>

</ol>
