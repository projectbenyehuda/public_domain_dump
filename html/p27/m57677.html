	<meta charset="utf-8"/>
	<title>עַל מַצֶבֶת רַב...</title>
	<meta name="author" content="אברהם בר גוטלובר"/>
</head>
<body>

<blockquote>
<p>מְצֹא מִשְׁפָּטִים, חֲדָשִׁים לַבְּקָרִים,</p>

<p>כָּל יְמֵי חַיָיו עָמַל וְיָגַע;</p>

<p>לָכֵן לֹא מָצָא עֵת לַעֲשׂוֹת מֵישָׁרִים,</p>

<p>וּמוֹרָא שָׁמַיִם בִּלְבָבוֹ לֹא נָגַע.</p>
</blockquote>

</body>
