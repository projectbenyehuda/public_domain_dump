	<title>[אַהֲבָה!]</title>
	<meta name="author" content="דוד הופשטיין"/>
</head>
<body>

<blockquote>
<br />
</blockquote>

<blockquote>
<p>אַהֲבָה!</p>

<p>אַךְ לְעִתִּים רְחוֹקוֹת הֵעָלִי מֵאָהֳלִי.</p>

<br />
</blockquote>

<blockquote>
<p>יָדַעְתִּי:</p>

<p>אַתְּ לֹא תַחֲרִיבִי עוֹלָמוֹת,</p>

<p>אוּלָם</p>

<p>חֲדָשִׁים תִּבְנִי, תְּגַלִּי.</p>

<br />
</blockquote>

</body>
