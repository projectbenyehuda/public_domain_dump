	<title>פתגם ערבי</title>
	<meta name="author" content="יוסף מזל"/>
</head>
<body>

<blockquote>
<br />
</blockquote>

<blockquote>
<p>האינו יודע שאינו יודע,</p>

<p>הוא סכל ולמדהו.</p>

<p>היודע שאינו יודע,</p>

<p>הוא עני ורחמהו.</p>

<p>האינו יודע שיודע,</p>

<p>הוא ישן והקיצהו.</p>

<p>היודע שיודע, הוא חכם ורוץ אחריהו.</p>

<br />
</blockquote>
