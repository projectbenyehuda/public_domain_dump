	<title>מי שאין לו פנאי</title>
	<meta name="author" content="שלמה זרחי"/>
</head>
<body>

<p>אפשר להאמין לאדם האומר שאין לו פנאי. אבל איך אפשר להאמין
לאדם הטוען שאין לו פנאי, ובכל־זאת הוא מוצא לו פנאי לספר לך עד כמה אין לו
פנאי.</p>

<blockquote>
