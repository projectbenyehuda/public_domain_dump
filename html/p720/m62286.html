<body>

<p><strong>69</strong></p>

<blockquote>
<p>&#8220;רוּחַ אֱלוֹהַּ מִמָּרוֹם יְפַעֲמֵנִי&#8221;</p>

<p>יִתְפָּאֵר יָקְטָן יִפְשׂק שְׂפָתָיִם,</p>

<p>אֶפֶס דְּבַר הַכָּתוּב יַזְכִּירֵנִי:</p>

<p><strong>&#8220;יַשֵּׁב רוּחוֹ – יִזְּלוּ-מָיִם!&#8221;</strong></p>

<br />
</blockquote>

<blockquote>
<br />
</blockquote>
