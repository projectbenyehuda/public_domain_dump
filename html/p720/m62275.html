<p><strong>58</strong></p>

<blockquote>
<p>רַק בִּנְפֹל עֵץ נִשָּׂא וָרָם</p>

<p>יֵרָאֶה אֶל-נָכוֹן גֹּבַהּ קוֹמָתוֹ</p>

<p>וּבְמוֹת אִישׁ נָבוֹן וְחָכָם</p>

<p>אַךְ אָז נַכִּיר יִתְרוֹן חָכְמָתוֹ.</p>

<br />
</blockquote>

<blockquote>
