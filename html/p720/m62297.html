	<title>הַמַּלְוֶה וְהַלּוֶֹה</title>
	<meta name="author" content="שלמה מנדלקרן"/>

<body>

<p><strong>80</strong></p>

<blockquote>
<p>– אֲדוֹנִי, הַגִּידָה־נָּא לִי:</p>

<p>מָתַי נִשְׁיִי אֵלַי תָּבִיא?</p>

<p>&quot;לָמָּה־זֶּה תִשְׁאַל אֶת־פִּי,</p>

<p>לֹא־נָבִיא אֲנִי וְלֹא בֶן־נָבִיא!&quot;</p>

<br />
</blockquote>

<blockquote>
<br />
</blockquote>
