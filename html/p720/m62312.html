<p><strong>95</strong></p>

<blockquote>
<p>מֵרֹאשׁ יֹאמְרוּ הַמֹּשְׁלִים, כִּי יֵשׁ לַכּוֹתֵל אָזְנָיִם</p>

<p>וַאֲנִי אוֹסִיפָה, כִּי לוֹ גַּם-פֶּה, לָשׁוֹן וּשְׂפָתָיִם&#8230;</p>

<br />
</blockquote>

<blockquote>
<br />
</blockquote>
