	<title>הַדְּמָעוֹת</title>
	<meta name="author" content="שלמה מנדלקרן"/>
</head>
<body>

<p><strong>75</strong></p>

<blockquote>
<p>הָאִישׁ אֲשֶר לֹא יוֹרִיד דְּמָעוֹת מִמְּקוֹר עֵינֵהוּ,</p>

<p>לֹא יוּכַל לִמְחוֹת דִּמְעָה גַּם מֵעַל-פְּנֵי רֵעֵהוּ!</p>

<br />
</blockquote>

<blockquote>
<br />
</blockquote>
