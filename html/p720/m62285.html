<body>

<p><strong>68</strong></p>

<blockquote>
<p>כִּי כָל-שִׁירֶיךָ לְאוֹר הוֹצֵאתָ</p>

<p>תָּשִׂישׂ תִּשְׂמַח אֱלֵי-גִיל,</p>

<p>כִּי דְבַר הֶחָכָם בָּזֶה מִלֵּאתָ</p>

<p><strong>&#8220;כָּל-רוּחוֹ יוֹצִיא כְסִיל&#8221;!</strong></p>

<br />
</blockquote>

<blockquote>
<br />
</blockquote>
